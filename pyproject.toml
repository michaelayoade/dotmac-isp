[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "dotmac-isp"
version = "2.0.0a1"
description = "Thin Dotmac ISP product assembly over exact Starter releases"
authors = [{ name = "Dotmac" }]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dynamic = ["dependencies"]

[tool.poetry]
packages = [{ include = "dotmac_isp", from = "src" }]
requires-poetry = "2.4.1"

[tool.poetry.dependencies]
python = ">=3.12,<3.14"

# Exact immutable commits peeled from the annotated release tags
# `dotmac-kernel-v0.1.0a83` and `dotmac-ui-v0.1.0a7`. Cross-repository path or
# editable dependencies are forbidden: this application owns its checkout and
# consumes only released Starter surfaces. The private-index artifact proof is
# still a cutover gate; the public VCS pins make this first candidate bootstrap
# reproducible without installing repository credentials.
dotmac-kernel = { git = "https://github.com/michaelayoade/dotmac_starter_mt.git", rev = "4cfdcd76739c9ad6c6dc249c1093849db7c3b752", subdirectory = "packages/dotmac-kernel" }
dotmac-ui = { git = "https://github.com/michaelayoade/dotmac_starter_mt.git", rev = "042532d2c80ee7a56b14b71269d15459288312c2", subdirectory = "packages/dotmac-ui" }

# Assembly-owned runtime/build dependencies. Domain dependencies arrive only
# with the cohort that needs them and only after a real release exists.
alembic = "^1.13"
psycopg = { version = "^3.2", extras = ["binary"] }
python-multipart = "^0.0.9"
uvicorn = { version = "^0.30", extras = ["standard"] }

[tool.poetry.group.dev.dependencies]
mypy = "1.17.1"
pytest = "8.4.2"
ruff = "0.13.0"

[tool.pytest.ini_options]
testpaths = ["tests/thin"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/dotmac_isp", "scripts"]
