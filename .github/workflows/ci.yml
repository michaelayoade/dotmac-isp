name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

env:
  POETRY_VERSION: "2.4.1"
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Thin assembly and containment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install exact Poetry
        run: pipx install "poetry==${POETRY_VERSION}"
      - name: Install the committed dependency graph
        run: poetry install --sync
      - name: Static gates
        run: make check
      - name: Thin-assembly canaries
        run: make test

  container:
    name: Candidate container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the target image
        run: docker build --build-arg "POETRY_VERSION=${POETRY_VERSION}" --tag dotmac-isp:candidate .
